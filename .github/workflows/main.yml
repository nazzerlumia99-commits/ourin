name: Extract ZIP

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q OURIN MD 3.3.zip -d extracted

      - name: Commit extracted files
        run: |
          cp -r extracted/. .
          rm -rf extracted

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Extract ZIP contents" || echo "No changes"
          git push
