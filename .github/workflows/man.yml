name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo

      - name: Extract ZIP
        run: |
          cd repo
          unzip -q "OURIN MD 3.3.zip" -d extracted

      - name: Commit extracted files
        run: |
          cd repo

          cp -r extracted/. .
          rm -rf extracted

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Extract ZIP contents" || echo "No changes"
          git push
