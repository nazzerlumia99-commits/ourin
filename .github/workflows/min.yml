name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          ls -la

      - name: Extract ZIP
        run: |
          cd repo
          unzip -q "OURIN MD 3.3.zip" -d extracted

      - name: Move extracted files to root
        run: |
          cd repo
          cp -r extracted/* .
          rm -rf extracted

      - name: Commit and push
        run: |
          cd repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract ZIP contents" || echo "No changes to commit"
          git push
